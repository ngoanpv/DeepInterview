packages:
  - "apps/*"
  - "packages/*"
  - "cli"
# pnpm 11 build-script allowlist (renamed from onlyBuiltDependencies, which pnpm
# 11 ignores). esbuild + sharp need their native postinstall to run; without
# approving them here, `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS in
# CI/Docker (non-interactive).
allowBuilds:
  esbuild: true
  sharp: true
# Pin a single @smithy/core: aws-sdk 3.1127.0's client-s3 (3.34.1) and
# s3-request-presigner (3.33.3) otherwise resolve two copies, and the two
# `Client` identities make getSignedUrl(S3Client) a type error (r2.ts).
overrides:
  "@smithy/core": "3.34.1"
